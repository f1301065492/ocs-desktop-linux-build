name: Release

# 手动触发的发布流程：顺延扩展版本号 → 打 tag → 构建 → 发布 Release。
#
# ⚠️ 版本号规则（用户 2026-10-24 定）：**x.y.z.n 四段**。
# - 前三位 x.y.z 跟随上游（同步上游时由 upstream-sync 更新）；
# - 第四位 n 是本分支扩展功能的序号，每次发版 +1。
#
# 注意：npm/electron-updater 只认 semver，四段 `3.1.0.1` 会让 electron-updater 抛
# ERR_UPDATER_INVALID_VERSION。因此：
# - package.json / 安装包 / latest*.yml 里用合法的 **3.1.0-1**（预发布位表示第四段）；
# - Release tag 与界面显示用 **v3.1.0.1 / 3.1.0.1**。
#
# 怎么触发：
#   gh workflow run release.yml --repo <owner>/<repo>
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      display: ${{ steps.bump.outputs.display }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: 计算并写入新版本号
        id: bump
        run: |
          set -e
          CURRENT=$(jq -r .version package.json)
          echo "当前内部版本: $CURRENT"

          # 前三位跟随上游；第四段允许两种写法：
          # - 内部 semver: x.y.z-n
          # - 历史/四段:   x.y.z.n
          CORE=$(echo "$CURRENT" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          EXT=$(echo "$CURRENT" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)$/\1/p')
          if [ -z "$EXT" ]; then
            EXT=$(echo "$CURRENT" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)$/\1/p')
          fi
          [ -n "$EXT" ] || EXT=0
          NEXT_EXT=$((EXT + 1))

          # 内部用 semver 预发布位，保证 electron-updater 能比较
          NEXT="${CORE}-${NEXT_EXT}"
          DISPLAY="${CORE}.${NEXT_EXT}"
          echo "上游核心: $CORE，扩展序号: $EXT -> $NEXT_EXT"
          echo "内部版本: $NEXT，展示/Release: $DISPLAY"

          jq --tab --arg v "$NEXT" '.version = $v' package.json > /tmp/root.json && mv /tmp/root.json package.json
          jq --tab --arg v "$NEXT" '.version = $v' packages/app/package.json > /tmp/app.json && mv /tmp/app.json packages/app/package.json

          echo "tag=v$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"

      - name: 提交并打 tag
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/app/package.json
          git commit -m "chore: release v${{ steps.bump.outputs.display }}"
          git tag "v${{ steps.bump.outputs.display }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.bump.outputs.display }}"

  build-and-publish:
    needs: prepare
    # 两个入参都必须传：
    # - ref：prepare 刚推了新提交，可复用 workflow 默认会 checkout 调用方的旧 commit，
    #   不传就会构建出错误版本号的产物
    # - release-tag：让它直接把产物传到 Release，绕开有配额的 Actions artifacts
    uses: ./.github/workflows/build-linux-appimage.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      release-tag: ${{ needs.prepare.outputs.tag }}

  # 发布完成后立刻让 VPS 自建更新源同步最新 Release（不必等每日定时任务）
  sync-mirror:
    needs: build-and-publish
    uses: ./.github/workflows/sync-mirror.yml
    secrets: inherit

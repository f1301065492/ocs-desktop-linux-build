name: Build Linux deb

# 独立于 build.yml：只构建 Linux x64 的 deb。
# 2026-10-29 用户规则：Linux 只发 deb，不再构建/发布 AppImage。
#
# 两种触发方式：
# - workflow_dispatch：手动出包，不涉及版本号
# - workflow_call：由 release.yml 在发布流程里调用，产物随后会被挂到 Release 上
#
# 两条路的入参**必须保持一致**（下面两处重复声明是刻意的）：
# 只把入参声明在 workflow_call 下的话，手动触发时传参会直接 422
# （Unexpected inputs provided），于是「不发版、只按某个已有 tag 出包」这条
# 路就走不通——而那正是补发/重发一个版本时需要的。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的 ref（tag / 分支 / commit）。留空则构建触发它的那个 ref。
          指定 tag 时务必填准，否则会构建出与预期版本号不符的产物
        type: string
        required: false
      release-tag:
        description: 传了就直接把产物传到该 tag 的 Release，不走 Actions artifact。
          artifacts 有存储配额（免费账户私有仓库 500MB），而安装包单个就有 500MB，
          走 artifacts 等于存两份还必然超配额
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: 要构建的 ref（tag / 分支 / commit）。发布流程必须传新打的 tag，
          否则会被复用成调用方的旧 commit，构建出错误版本号的产物
        type: string
        required: false
      release-tag:
        description: 传了就直接把产物传到该 tag 的 Release，不走 Actions artifact。
          发布流程用这个——artifacts 有存储配额（免费账户私有仓库 500MB），
          而安装包单个就有 500MB，走 artifacts 等于存两份还必然超配额
        type: string
        required: false

permissions:
  contents: write

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # 不传 ref 时保持默认行为（构建触发它的那个 ref）
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set Env
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PLATFORM=linux" >> $GITHUB_ENV
          echo "ARCH=x64" >> $GITHUB_ENV

      - name: Cache built-in Chrome
        uses: actions/cache@v4
        with:
          path: bin/chrome
          key: builtin-chrome-137.0.7151.55-${{ runner.os }}
          restore-keys: |
            builtin-chrome-137.0.7151.55-

      - name: Build
        run: pnpm build
        env:
          USE_HARD_LINKS: false
          PLATFORM: linux
          ARCH: x64

      # electron-builder 在仅 deb 目标 / --publish never 时不会产出 latest-linux.yml；
      # 客户端 deb 更新靠它读取 version（并校验 sha512），始终按 deb 现算一份。
      - name: Generate update metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const dir = 'releases';
          const appPkg = JSON.parse(fs.readFileSync('packages/app/package.json', 'utf8'));
          const deb = fs.readdirSync(dir).find((f) => f.endsWith('.deb'));
          if (!deb) throw new Error('releases/ 下没有 deb');
          const buffer = fs.readFileSync(path.join(dir, deb));
          const sha512 = crypto.createHash('sha512').update(buffer).digest('base64');
          const content = [
            `version: ${appPkg.version}`,
            'files:',
            `  - url: ${deb}`,
            `    sha512: ${sha512}`,
            `    size: ${buffer.length}`,
            `path: ${deb}`,
            `sha512: ${sha512}`,
            `releaseDate: '${new Date().toISOString()}'`,
            ''
          ].join('\n');
          fs.writeFileSync(path.join(dir, 'latest-linux.yml'), content);
          console.log('已生成 latest-linux.yml（', deb, '）');
          NODE

      # 发布流程：直接传到 Release。不经过 Actions artifact——
      # 那边有存储配额（免费账户私有仓库 500MB），而单个安装包就 500MB，
      # 走 artifacts 既存两份又必然超配额
      - name: Upload to Release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ inputs.release-tag }}"
          ls -lh releases/*.deb

          # tag 由发布流程的上游 job 创建；这里只补 Release，已存在时不报错
          gh release create "$TAG" --title "$TAG" --generate-notes || true

          # 必须一起上传 latest-linux.yml：客户端靠它检查更新
          # CHANGELOG.md：3.6 起更新弹窗按 `${更新源}/CHANGELOG.md` 拉取版本日志
          gh release upload "$TAG" \
            releases/*.deb \
            releases/latest-linux.yml \
            CHANGELOG.md \
            --clobber

          echo "已发布: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      # 临时出包（workflow_dispatch）：产物只进 Actions artifacts 供手动下载
      - name: Upload as artifact
        if: inputs.release-tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ocs-${{ env.VERSION }}-linux-x64-deb
          path: |
            releases/*.deb
            releases/latest-linux.yml
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 7
